<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neathbound CMS</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 300px; border-right: 1px solid #ccc; padding: 1rem; overflow-y: auto; background: #fafafa; }
        #editor { flex-grow: 1; padding: 2rem; overflow-y: auto; }
        .storylet-item { padding: 0.75rem; cursor: pointer; border-bottom: 1px solid #eee; border-radius: 4px; }
        .storylet-item:hover { background-color: #e2e8f0; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #333; }
        input[type="text"], textarea { width: 100%; padding: 0.75rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        textarea { height: 150px; resize: vertical; }
        button { padding: 0.75rem 1.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Storylets</h2>
        <div id="storylet-list"></div>
    </div>
    <div id="editor">
        <h2>Edit Storylet</h2>
        <div id="form-container" style="display: none;">
            <div class="form-group">
                <label>Storylet ID</label>
                <input type="text" id="story-id" readonly style="background: #f0f0f0; color: #666;">
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="story-title">
            </div>
            <div class="form-group">
                <label>Kicker</label>
                <input type="text" id="story-kicker">
            </div>
            <div class="form-group">
                <label>Text</label>
                <textarea id="story-text"></textarea>
            </div>
            <button id="save-btn">Save Changes (Stub)</button>
        </div>
        <p id="empty-state">Select a storylet from the sidebar to edit its properties.</p>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
