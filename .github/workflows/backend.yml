# Deploys the Supabase `api` Edge Function whenever the game rules, content or
# API change on main. Game content ships inside the function (src/game), so
# this is also how writers' content edits reach the online game.
# Needs repository secret SUPABASE_ACCESS_TOKEN (Supabase personal access token).
name: Deploy backend
on:
  push:
    branches: [main]
    paths:
      - "src/game/**"
      - "supabase/**"
      - "scripts/sync-engine.mjs"
  workflow_dispatch:
permissions:
  contents: read
env:
  PROJECT_REF: ynrfskgfrgqxwjswtnka
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the shared game modules into the function
        run: node scripts/sync-engine.mjs
      - run: npm test
      - name: Require the Supabase token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the api function was NOT deployed."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the api function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --use-api
