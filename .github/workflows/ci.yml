name: NeathBound CI

on:
  push:
    branches: ["main", "feature/**", "agent/**", "narrative/**"]
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full release checks
        run: npm run release:check
