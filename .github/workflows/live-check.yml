# After each GitHub Pages deploy, checks the LIVE site the way a player would
# (offline mode, so no online players are created) and checks the online API
# is reachable and still refuses unauthenticated requests.
name: Live site check
on:
  workflow_run:
    workflows: ["Deploy NeathBound to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
env:
  SITE: https://parris-tech-services.github.io/NeathBound/
  API: https://ynrfskgfrgqxwjswtnka.supabase.co/functions/v1/api/player
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report API state without blocking local-only browser tests
        run: |
          preflight=$(curl --max-time 8 -s -o /dev/null -w "%{http_code}" -X OPTIONS "$API" -H "Origin: https://parris-tech-services.github.io" -H "Access-Control-Request-Method: GET" || true)
          anonymous=$(curl --max-time 8 -s -o /dev/null -w "%{http_code}" "$API" || true)
          echo "CORS preflight: $preflight, unauthenticated GET: $anonymous"
          if [ "$anonymous" = "200" ]; then
            echo "::error::API accepted an unauthenticated request."
            exit 1
          fi
          if [ "$preflight" != "200" ] || [ "$anonymous" != "401" ]; then
            echo "::warning::Online API unavailable; testing the deployed browser game with ?api=local instead."
            echo "Online API: unavailable (preflight $preflight; unauthenticated $anonymous). Local-only game testing continues." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Online API: healthy and protected by authentication." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install test-only tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1 axe-core@4
          npx playwright install --with-deps chromium
      - name: Play the live site
        env:
          BASE_URL: ${{ env.SITE }}
          E2E_REPORT: e2e-report.md
        run: npm run test:e2e
      - name: Browser test report
        if: always()
        run: cat e2e-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
